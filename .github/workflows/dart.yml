name: iOS-ipa-build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: iOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify iOS project
        run: |
          test -f mi_app/pubspec.yaml
          test -d mi_app/ios/Runner.xcodeproj
          ls -la mi_app/ios

      - name: Get Flutter dependencies
        working-directory: mi_app
        run: flutter pub get

      - name: Build IPA
        working-directory: mi_app
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlutterIpaExport
          path: mi_app/build/ios/ipa/*.ipa
          if-no-files-found: error
