name: iOS-ipa-build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify Flutter project
        run: |
          pwd
          ls -la
          ls -la mi_app
          test -f mi_app/pubspec.yaml

      - name: Get Flutter dependencies
        working-directory: mi_app
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: mi_app/ios
        run: pod install --repo-update

      - name: Build iOS
        working-directory: mi_app
        run: flutter build ios --release --no-codesign

      - name: Create IPA package
        working-directory: mi_app
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r FlutterIpaExport.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlutterIpaExport
          path: mi_app/build/ios/iphoneos/FlutterIpaExport.ipa
          if-no-files-found: error
